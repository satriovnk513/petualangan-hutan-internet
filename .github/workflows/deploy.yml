# Membangun dan menerbitkan situs ke GitHub Pages setiap kali ada push ke main.
#
# Sebelum dipakai:
#   1. Buka Settings -> Pages, bagian Source pilih "GitHub Actions".
#   2. Pastikan REPO_BASE di vite.config.js sudah sesuai nama repository.
name: Terbitkan ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Hanya satu penerbitan yang berjalan dalam satu waktu.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Bangun situs
        run: npm run build
        env:
          # Alamat dasar mengikuti nama repository secara otomatis.
          # Untuk domain sendiri atau repo <username>.github.io, ganti dengan "/".
          VITE_BASE: /${{ github.event.repository.name }}/

      - name: Siapkan artefak Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Terbitkan ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
